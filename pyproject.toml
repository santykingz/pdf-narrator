[project]
name = "pdf-narrator"
version = "0.1.0"
description = "Drop a PDF in, get a cloned-voice audiobook out."
requires-python = ">=3.10,<3.12"
readme = "README.md"

# Dependencies are split across requirements-core.txt (light, milestone 1)
# and requirements-ml.txt (torch/XTTS/pyannote, later milestones) so you can
# run PDF->text without the multi-GB ML download. See README.

[project.scripts]
narrator = "narrator.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
